baseURL = "http://localhost:1313/"
title = "Documents Lowdit"
defaultContentLanguage = "fr"
locale = "fr-FR"

# Dev/`hugo server` : thème résolu en local via `themes/` (symlink).
# La prod utilise `config/production/hugo.toml` (module GitHub).
theme = "minigo"

[params.lowdit]
  logo = "logos/minigo.png"
  faviconDir = "favicons/minigo"
  siteProfile = "library"
  view = "thinktank"
  homeEyebrow = "Minigo · coque catalogue"
  mainSections = ["reports", "guides"]
  listStyle = "timeline"
  showSummary = true
  showDate = true
  search = "pagefind"

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Guides"
  url = "/guides/"
  weight = 2
[[menus.main]]
  name = "Rapports"
  url = "/reports/"
  weight = 3
[[menus.main]]
  name = "Installation"
  identifier = "installation"
  url = "/installation/"
  weight = 10

[markup.goldmark.renderer]
  unsafe = true
