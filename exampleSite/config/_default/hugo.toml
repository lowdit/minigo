baseURL = "http://localhost:1313/"
title = "Documents Lowdit"
defaultContentLanguage = "fr"
locale = "fr-FR"

# Modules résolus sur les dépôts locaux par bin/hugo.work (aussi pour hugo server).
# La prod utilise `config/production/hugo.toml` (module GitHub).
theme = ["github.com/lowdit/minigo"]

[params.lowdit]
  logo = "logos/minigo.png"
  faviconDir = "favicons/minigo"
  socialImage = "/assets/social/twittercard-default.png"
  siteProfile = "ds-showroom"
  view = "thinktank"
  homeEyebrow = "Minigo · showroom coque"
  mainSections = ["reports", "guides"]
  listStyle = "timeline"
  showSummary = true
  showDate = true
  search = "pagefind"

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Guides"
  url = "/guides/"
  weight = 2
[[menus.main]]
  name = "Rapports"
  url = "/reports/"
  weight = 3
[[menus.main]]
  name = "Installation"
  identifier = "installation"
  url = "/installation/"
  weight = 10

[markup.goldmark.renderer]
  unsafe = true

[module]
  # Espace de travail local : minigo, lowdit-kit et les modules du disque.
  workspace = "../../bin/hugo.work"
