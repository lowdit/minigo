baseURL = "http://localhost:1313/"
title = "Documents Lowdit"
defaultContentLanguage = "fr"
locale = "fr-FR"

[module]
  [[module.imports]]
    path = "github.com/lowdit/minigo"

theme = "minigo"

[params.lowdit]
  siteProfile = "library"
  view = "thinktank"
  homeEyebrow = "Minigo · coque catalogue"
  mainSections = ["reports"]
  listStyle = "timeline"
  showSummary = true
  showDate = true
  search = "pagefind"

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Produit"
  url = "/product/"
  weight = 2
[[menus.main]]
  name = "Rapports"
  url = "/reports/"
  weight = 3

[markup.goldmark.renderer]
  unsafe = true
