<article class="lowdit-product">
  <header class="minigo-hero">
    <p class="minigo-hero__eyebrow">{{ i18n "product-eyebrow" | default "Produit" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="minigo-hero__lead">{{ . }}</p>{{ end }}
  </header>
  <div class="lowdit-product__layout">
    {{- $section := .CurrentSection -}}
    <nav class="lowdit-product__nav" aria-label="{{ i18n "product-nav" | default "Documentation produit" }}">
      <ul>
        {{- with $section -}}
          <li>
            <a href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
          </li>
          {{- range .Pages.ByWeight -}}
            <li>
              <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>{{ .LinkTitle }}</a>
            </li>
          {{- end -}}
        {{- end -}}
      </ul>
    </nav>
    <div class="lowdit-product__content minigo-intro">
      {{ .Content }}
    </div>
  </div>
</article>
