{{/* Dict: art (visual-art dict), motif, label, thumbnail (optional URL) */}}
{{- $art := .art -}}
<div
  class="catalog-card__visual"
  data-visual="{{ $art.variant }}"
  data-overlay="{{ $art.overlay }}"
  style="--catalog-accent: {{ $art.accent }}; --visual-angle: {{ $art.angle }}deg;"
>
  {{- with .thumbnail -}}
    <img class="catalog-card__img" src="{{ . }}" alt="" loading="lazy" decoding="async">
  {{- else -}}
    {{- with .label -}}<span class="catalog-card__label" aria-hidden="true">{{ . }}</span>{{- end -}}
  {{- end -}}
</div>
