{{ define "main" }}
<article>
  <header class="minigo-page-header">
    <h1>{{ .Title }}</h1>
    {{ if (partial "lowdit/display-flags.html" .).showDate }}{{- with partial "lowdit/page-date.html" . -}}<p class="minigo-desc">{{ . }}</p>{{- end -}}{{ end }}
  </header>
  {{ partial "exports/links.html" . }}
  <div class="minigo-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
