[module]
  [module.hugoVersion]
    extended = false
    min = "0.128.0"
  # Minigo = site navigable minimal (accueil, rubriques, pages, RSS, recherche).
  # Tout le visuel (jetons, base, composants, modèles, coque CSS, polices) vient
  # du kit générique : aucune copie ici.
  [[module.imports]]
    path = "github.com/lowdit/lowdit-kit"

[markup.goldmark.renderer]
  unsafe = true

[params.lowdit]
  # Marque minigo par défaut ; un site la remplace par la sienne.
  logo = "logos/minigo.png"
  faviconDir = "favicons/minigo"
  # Modèle du site : `model = "<nom>"` (défaut : catalog). Les modèles sont
  # déclarés par les modules qui les servent (voir [params.lowdit.models]).
  listStyle = "timeline"
  paginate = 20
  showSummary = true
  showDate = true
  showPrintLink = true
  showPresentationLink = true
  search = ""

# Modèles servis par minigo : accueil (home) et feuille (sheet, assets/css/views/).
# Un autre module peut compléter un modèle (ex. sligo ajoute la feuille de decks).
[params.lowdit.models.catalog]
  sheet = "catalog"
[params.lowdit.models.hub]
  home = "home/thinktank.html"
  sheet = "thinktank"
[params.lowdit.models.showroom]
  home = "home/ds-showroom.html"
  sheet = "thinktank"
[params.lowdit.models.decks]
  home = "home/presentations.html"
