[module]
  [module.hugoVersion]
    extended = false
    min = "0.128.0"
  # `lowdit-brand` n'est PAS un module Hugo : ses assets (tokens, lowdit-base,
  # lowdit-system, views, composants) sont copiés dans minigo via
  # `lowdit-brand/scripts/sync-brand.sh`. Rien à importer ici.

[markup.goldmark.renderer]
  unsafe = true

[params.lowdit]
  siteProfile = "catalog"
  # view = "catalog"  # publisher | deck-studio | thinktank | cv-vitrine | inquiry | none
  listStyle = "timeline"
  paginate = 20
  showSummary = true
  showDate = true
  showPrintLink = true
  showPresentationLink = true
  search = ""
