[module]
  [module.hugoVersion]
    extended = false
    min = "0.128.0"
  # Minigo = site navigable minimal (accueil, rubriques, pages, RSS, recherche).
  # Tout le visuel (jetons, base, composants, modèles, coque CSS, polices) vient
  # du kit générique : aucune copie ici.
  [[module.imports]]
    path = "github.com/lowdit/lowdit-kit"

[markup.goldmark.renderer]
  unsafe = true

[params.lowdit]
  # Marque minigo par défaut ; un site la remplace par la sienne.
  logo = "logos/minigo.png"
  faviconDir = "favicons/minigo"
  siteProfile = "catalog"
  # view = "catalog"  # publisher | deck-studio | thinktank | cv-vitrine | inquiry | none
  listStyle = "timeline"
  paginate = 20
  showSummary = true
  showDate = true
  showPrintLink = true
  showPresentationLink = true
  search = ""
