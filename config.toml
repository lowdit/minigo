[module]
  [module.hugoVersion]
    extended = false
    min = "0.128.0"
  # Optionnel : importer brand quand minigo est chargé comme module Hugo.
  # [[module.imports]]
  #   path = "github.com/lowdit/brand"

[markup.goldmark.renderer]
  unsafe = true

[params.lowdit]
  siteProfile = "catalog"
  listStyle = "timeline"
  paginate = 20
  showSummary = true
  showDate = true
  showPrintLink = true
  showPresentationLink = true
  search = ""
